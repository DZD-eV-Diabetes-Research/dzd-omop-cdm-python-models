networks:
  defaultnet:


services:
  omopcodegen:
    build:
      dockerfile: ./dockerfile
    environment:
      POSTGRESQL_HOST: postgresql
      POSTGRESQL_USER: omop
      POSTGRESQL_DATABASE: omop
      POSTGRESQL_PASSWORD: omop
      POSTGRESQL_PORT: 5432
    user: ${UID:-1000}:${GID:-1000}
    volumes:
      # Not packages/dzdomop/src/omopmodel yet: the output still differs from the
      # committed models until the OMOP generator subclasses are in.
      - ./build/omopmodel:/output
      - ./downloads:/downloads
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - defaultnet

  postgresql:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_PASSWORD=omop
      - POSTGRES_DB=omop
      - POSTGRES_USER=omop
      - POSTGRES_INITDB_ARGS=--lc-collate C.UTF-8 --lc-ctype C --encoding UTF8
    healthcheck:
      test: "pg_isready -h localhost -p 5432 -q -U omop"
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - defaultnet
