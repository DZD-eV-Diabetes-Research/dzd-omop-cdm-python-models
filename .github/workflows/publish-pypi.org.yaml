name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # PyPI trusted publishing: no API token. Needs a trusted publisher on pypi.org for
    # this repo, workflow `publish-pypi.org.yaml` and environment `pypi`.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs the tags for the version
      - uses: astral-sh/setup-uv@v10
      - name: Build package
        run: uv build --package dzdomop --out-dir dist
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist
