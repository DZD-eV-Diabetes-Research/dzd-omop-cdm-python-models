name: Docs

# Builds the docs site (zensical.toml) on every push and pull request, so broken links fail
# early. A push to main or beta publishes both to GitHub Pages (tools/build_site.py): the
# released docs from main at /, a preview of the next release from beta at /beta/.
# Needs once: repo Settings → Pages → Source "GitHub Actions", and main and beta
# allowed in Settings → Environments → github-pages.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build_site.py checks out origin/main and origin/beta
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --only-group docs
      - run: uv run --no-sync zensical build --strict --clean
      - name: Build main and beta for Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
        run: uv run --no-sync python tools/build_site.py --out pages
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
        with:
          path: pages

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
