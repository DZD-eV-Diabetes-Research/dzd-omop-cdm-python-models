name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest

  # Oldest allowed versions of dzdomop's direct dependencies (SQLAlchemy 2.0 line).
  test-lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.10"
      - run: uv venv
      - run: >-
          uv pip install --resolution lowest-direct
          -e "packages/dzdomop[sqlmodel,pg8000,progress]" "pytest>=8"
      - run: uv pip list
      # Only the package tests: the generator (generator/tests) isn't installed here.
      - run: .venv/bin/python -m pytest tests
